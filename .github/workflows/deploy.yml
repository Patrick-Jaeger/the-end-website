name: Build and Deploy Vite React to Main Branch

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Node.js installieren
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Abhängigkeiten installieren
      - name: Install dependencies
        run: npm install

      # 4️⃣ Projekt bauen (Vite)
      - name: Build project
        run: npm run build

      # 5️⃣ Build-Ordner auf Main Branch pushen
      #    Hier nutzen wir commit & push, da gh-pages nicht mehr verwendet wird
      - name: Push build to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git rm -r --cached dist || true
          git add -f dist
          git commit -m "Deploy built site [skip ci]" || echo "Nothing to commit"
          git push origin main
